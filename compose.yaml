services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./workspace
    container_name: app_backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_HOST: jdbc:postgresql://postgres:5432/workspace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    command:
      - "./mvnw"
      - "spring-boot:run"
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge